<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>AlayaFlux Founders' Seal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070E1A;--bg2:#0B1626;--card:#0F1D31;--line:#1E3350;--txt:#E8EEF7;--mute:#9DB0C8;--gold:#F2C45A;--gold2:#B8862B;--up:#3DD68C;--down:#FF6B6B}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -80px,#1a2d4d 0,var(--bg) 70%) no-repeat,var(--bg);color:var(--txt);font:16px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:Sora,Inter,sans-serif;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.hero{text-align:center;padding:10px 0 6px}
.eyebrow{font-size:.78rem;letter-spacing:.22em;color:var(--gold);font-weight:600}
.hero h1{font-size:clamp(1.7rem,6vw,2.4rem);margin:6px 0 2px;letter-spacing:-.01em}
.hero p{color:var(--mute);margin:0}
.stage{perspective:1100px;height:290px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;cursor:grab;margin-top:6px}
.stage:active{cursor:grabbing}
.coin{position:relative;width:230px;height:230px;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.face i{position:absolute;inset:0;border-radius:50%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);background-size:260% 100%;mix-blend-mode:soft-light;pointer-events:none}
.edge{position:absolute;backface-visibility:visible}
.shadow{width:170px;height:22px;margin:-8px auto 6px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(3px)}
.badge{display:inline-block;font-size:.74rem;font-weight:600;color:#1a1204;background:var(--gold);border-radius:999px;padding:3px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.lbl{color:var(--mute);font-size:.82rem}
.val{font:700 2rem Sora,sans-serif;letter-spacing:-.02em;line-height:1.1}
.chg{font-weight:600;font-size:.95rem}.up{color:var(--up)}.down{color:var(--down)}
.rng{display:flex;gap:6px}.rng button{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:5px 11px;font:600 .8rem Inter,sans-serif;cursor:pointer}
.rng button.on{background:var(--gold);color:#1a1204;border-color:var(--gold)}
svg{width:100%;display:block;margin-top:10px;touch-action:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st b{display:block;font:700 1.15rem Sora,sans-serif;margin-top:2px}
.note{margin-top:14px;font-size:.84rem;color:var(--mute);border-left:3px solid var(--gold2);padding:2px 0 2px 12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}.coin{width:260px;height:260px}.stage{height:320px}}
</style></head><body>

<script>
// ---- DATA: replace with real values later: [{d:'2026-11-01',v:400},{d:'2026-11-02',v:402.35}, ...]
const START=400;            // initial fund in USD
const DATA=null;            // null = demo data is shown
// ---------------------------------------------------------------------------
const $=s=>document.querySelector(s);
const demo=()=>{let s=20261028;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;let v=START;const out=[],n=180,e=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(e);d.setDate(e.getDate()-i);v*=1+(r()-0.455)*0.02+0.0008;out.push({d:d.toISOString().slice(0,10),v:+v.toFixed(2)})}return out};
const series=DATA||demo();
const money=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>(v>=0?'+':'')+v.toFixed(2)+'%';
const sgn=v=>(v>=0?'+':'-')+money(Math.abs(v));
const fd=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
let range=90,pts=[];
function setChange(a,b,label){const d=b-a,p=a?d/a*100:0;const el=$('#chg');el.className='chg '+(d>=0?'up':'down');el.textContent=sgn(d)+'  ('+pct(p)+')'+(label?'  '+label:'')}
function draw(){
  pts=range?series.slice(-range):series; const svg=$('#ch'),W=svg.clientWidth||340,H=260,pl=6,pr=54,pt=12,pb=24;
  const vals=pts.map(p=>p.v);let mn=Math.min(...vals,START),mx=Math.max(...vals,START);const pad=(mx-mn)*.12||1;mn-=pad;mx+=pad;
  const n=pts.length,x=i=>pl+(W-pl-pr)*i/Math.max(1,n-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const up=pts[n-1].v>=pts[0].v,col=up?'#3DD68C':'#FF6B6B';
  let line='',i;for(i=0;i<n;i++)line+=(i?'L':'M')+x(i).toFixed(1)+' '+y(pts[i].v).toFixed(1);
  const area=line+'L'+x(n-1).toFixed(1)+' '+(H-pb)+'L'+x(0).toFixed(1)+' '+(H-pb)+'Z';
  let g='';for(i=0;i<4;i++){const v=mn+(mx-mn)*i/3,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#1E3350" stroke-width="1"/><text x="${W-pr+6}" y="${yy+4}" fill="#9DB0C8" font-size="11">${v.toFixed(0)}</text>`}
  let xl='';[0,.33,.66,1].forEach(f=>{const k=Math.round((n-1)*f);xl+=`<text x="${Math.min(Math.max(x(k),18),W-pr-14)}" y="${H-6}" fill="#9DB0C8" font-size="11" text-anchor="middle">${fd(pts[k].d)}</text>`});
  const base=(START>mn&&START<mx)?`<line x1="${pl}" x2="${W-pr}" y1="${y(START)}" y2="${y(START)}" stroke="#F2C45A" stroke-dasharray="4 4" opacity=".6"/><text x="${W-pr+6}" y="${y(START)-4}" fill="#F2C45A" font-size="10">start</text>`:'';
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<defs><linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".32"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${g}${base}<path d="${area}" fill="url(#af)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><g id="xh" style="display:none"><line id="xl" y1="${pt}" y2="${H-pb}" stroke="#E8EEF7" stroke-opacity=".5"/><circle id="xc" r="5" fill="${col}" stroke="#fff" stroke-width="2"/></g><circle id="end" cx="${x(n-1)}" cy="${y(pts[n-1].v)}" r="4" fill="${col}"/>${xl}`;
  svg._m={x,y,n,W,pl,pr};
  rest();
}
function rest(){const a=pts[0].v,b=pts[pts.length-1].v;$('#dt').textContent='Portfolio value';$('#val').textContent=money(b);setChange(a,b,{7:'1W',30:'1M',90:'3M',0:'All'}[range])}
function hover(e){const svg=$('#ch'),m=svg._m;if(!m)return;const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*(m.W/r.width);
  const i=Math.max(0,Math.min(m.n-1,Math.round((px-m.pl)/(m.W-m.pl-m.pr)*(m.n-1))));const p=pts[i];
  $('#xh').style.display='';$('#xl').setAttribute('x1',m.x(i));$('#xl').setAttribute('x2',m.x(i));$('#xc').setAttribute('cx',m.x(i));$('#xc').setAttribute('cy',m.y(p.v));
  $('#dt').textContent=fd(p.d);$('#val').textContent=money(p.v);setChange(pts[0].v,p.v,'')}
const ch=$('#ch');ch.addEventListener('pointermove',hover);ch.addEventListener('pointerdown',hover);
['pointerleave','pointerup','pointercancel'].forEach(t=>ch.addEventListener(t,()=>{const h=$('#xh');if(h)h.style.display='none';rest()}));
$('#rng').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;range=+b.dataset.r;document.querySelectorAll('#rng button').forEach(x=>x.classList.toggle('on',x===b));draw()});
addEventListener('resize',draw);
// stats
const last=series[series.length-1],wk=series[Math.max(0,series.length-8)];

const wg=(last.v-wk.v)/wk.v*100;$('#s3').innerHTML=`<span class="${wg>=0?'up':'down'}">${pct(wg)}</span>`;
$('#upd').textContent=new Date(last.d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

// ---- 3D coin
const coin=$('#coin'),R=()=>coin.clientWidth/2,T=26,N=64,edges=[];
(function(){for(let k=0;k<N;k++){const e=document.createElement('div');e.className='edge';e.style.cssText=`height:${T}px;top:calc(50% - ${T/2}px);background:repeating-linear-gradient(90deg,#7a4e0d 0 1.5px,#f7dd8c 1.5px 3.5px,#c9962f 3.5px 5px)`;coin.appendChild(e);edges.push(e)}})();
function layout(){const r=R(),w=2*Math.PI*r/N+1.5;edges.forEach((e,k)=>{e.style.width=w+'px';e.style.left=`calc(50% - ${w/2}px)`;e.style.transform=`rotateZ(${k*360/N}deg) translateY(${(-r*Math.cos(Math.PI/N)).toFixed(2)}px) rotateX(90deg)`});
  $('#ff').style.transform=`translateZ(${T/2}px)`;$('#fb').style.transform=`rotateY(180deg) translateZ(${T/2}px)`}
layout();addEventListener('resize',layout);
let ang=-25,vel=.35,drag=false,lx=0;const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(){if(!drag&&!still){ang+=vel;vel+=(0.35-vel)*.03}
  coin.style.transform=`rotateX(-12deg) rotateY(${ang}deg)`;
  const c=Math.cos(ang*Math.PI/180);
  const ra=ang*Math.PI/180,L=[-.35,-.55,.76];
  edges.forEach((e,k)=>{const th=k*2*Math.PI/N,nx=Math.sin(th)*Math.cos(ra),ny=-Math.cos(th),nz=-Math.sin(th)*Math.sin(ra);const d=Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]);e.style.filter=`brightness(${(.5+.9*d).toFixed(2)})`});
  $('#ff i').style.backgroundPosition=((1-Math.abs(((ang%360)+360)%360-0)/180)*100)+'% 0';
  $('#fb i').style.backgroundPosition=((((ang+180)%360+360)%360)/360*200)+'% 0';
  requestAnimationFrame(frame)}
frame();
const st=$('#stage');st.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;st.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx;lx=e.clientX;ang+=dx*.6;vel=dx*.4});
['pointerup','pointercancel'].forEach(t=>st.addEventListener(t,()=>{drag=false}));
</script></body></html>
