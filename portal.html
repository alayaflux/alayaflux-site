.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:.88rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
textarea{min-height:130px;resize:vertical}
button{background:var(--blue);color:#04101F;border:0;border-radius:10px;padding:10px 18px;font:600 .95rem Inter,sans-serif;cursor:pointer}
button.g{background:transparent;color:var(--txt);border:1px solid var(--line)}button.ok{background:var(--ok)}button.w{background:var(--warn)}button:disabled{opacity:.4;cursor:not-allowed}
button.sm{padding:6px 12px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;padding:6px 10px;background:transparent;color:var(--mute);border:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.top img{height:34px}.top small{color:var(--mute);display:block;line-height:1.2}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;max-width:900px;margin:0 auto}
.tabs button{background:var(--card);color:var(--mute);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--blue);color:#04101F}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.s-submitted{color:var(--warn)}.s-approved{color:var(--ok)}.s-feedback{color:var(--bad)}.s-draft{color:var(--mute)}
.msg{color:var(--bad);min-height:1.3em;font-size:.92rem}.mut{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sc{overflow-x:auto}.hide{display:none}

.sl-hero{text-align:center;padding:4px 0}.sl-eye{font-size:.76rem;letter-spacing:.22em;color:#F2C45A;font-weight:600}
.sl-hero h2{font-size:1.7rem;margin:4px 0 2px}.sl-stage{perspective:1100px;height:270px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;cursor:grab}
.sl-coin{position:relative;width:220px;height:220px;transform-style:preserve-3d}
.sl-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.sl-face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.sl-face i{position:absolute;inset:0;border-radius:50%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);background-size:260% 100%;mix-blend-mode:soft-light;pointer-events:none}
.sl-edge{position:absolute}.sl-shadow{width:160px;height:20px;margin:-10px auto 4px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(3px)}
.sl-val{font:700 1.9rem Sora,sans-serif;letter-spacing:-.02em;line-height:1.1}.sl-up{color:var(--ok)}.sl-down{color:var(--bad)}
.sl-rng{display:flex;gap:6px}.sl-rng button{background:transparent;border:1px solid var(--line);color:var(--mute);padding:5px 11px;font-size:.8rem}.sl-rng button.on{background:#F2C45A;color:#1a1204;border-color:#F2C45A}
.sl-svg{width:100%;display:block;margin-top:10px;touch-action:none}
.sl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sl-st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.sl-st b{display:block;font:700 1.1rem Sora,sans-serif;margin-top:2px}
.sl-mem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.sl-mem:first-of-type{border-top:0}
.sl-bar{height:6px;border-radius:6px;background:var(--bg2);margin-top:6px;overflow:hidden}.sl-bar i{display:block;height:100%;background:linear-gradient(90deg,#B8862B,#F2C45A)}
.sl-inp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
@media(min-width:620px){.sl-grid{grid-template-columns:repeat(3,1fr)}.sl-coin{width:250px;height:250px}.sl-stage{height:310px}}

.idc{max-width:420px;margin:0 auto;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#10294a,#070e1a 70%);border:1px solid #B8862B;box-shadow:0 10px 30px rgba(0,0,0,.45);position:relative}
.idc>*{position:relative}.idc>.idc-wm{position:absolute;left:50%;top:44%;width:62%;transform:translate(-50%,-50%);opacity:.06;pointer-events:none}
.idc-top{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(90deg,#B8862B,#F2C45A);color:#1a1204}.idc-top img{height:38px;width:auto}
.idc-h{font:700 1.05rem Sora,sans-serif;letter-spacing:.06em;line-height:1.1}.idc-sub{font-size:.76rem}
.idc-body{display:flex;gap:14px;padding:16px}
.idc-ph{width:104px;height:132px;border-radius:10px;border:2px solid #F2C45A;background:var(--bg2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--mute);font-size:.7rem;text-align:center}.idc-ph img{width:100%;height:100%;object-fit:cover}
.idc-n{font:700 1.2rem Sora,sans-serif;line-height:1.15}.idc-f{font-size:.82rem;color:var(--mute);margin-top:6px;line-height:1.65}.idc-f b{color:var(--txt);font-weight:600}
.idc-sig{padding:0 16px 10px;display:flex;align-items:flex-end;gap:10px;font-size:.72rem;color:var(--mute)}.idc-sig img{height:44px;max-width:160px;background:#fff;border-radius:4px;padding:2px;object-fit:contain}
.idc-coins{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 10px 8px;border-top:1px solid #1E3350;background:rgba(0,0,0,.25)}
.idc-c{text-align:center;font-size:.7rem;color:var(--mute)}.idc-c img{width:56px;height:56px}.idc-c b{display:block;font-size:1rem;color:var(--txt)}
.idc-tot{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:linear-gradient(90deg,rgba(184,134,43,.15),rgba(242,196,90,.25))}.idc-tot b{font:700 1.6rem Sora,sans-serif;color:#F2C45A}
.idc-ft{text-align:center;font-size:.7rem;color:var(--mute);padding:8px 8px 12px}
@media print{body *{visibility:hidden}#idc,#idc *{visibility:visible}#idc{position:absolute;left:0;top:0}}
.idc-seal{margin:0 12px 10px;padding:8px 10px;border:1px solid #B8862B;border-radius:10px;background:rgba(184,134,43,.1)}.idc-sh{font:700 .72rem Sora,sans-serif;letter-spacing:.12em;color:#F2C45A;margin-bottom:4px}.idc-sg{display:flex;gap:6px}.idc-sg div{flex:1;text-align:center}.idc-sg span{display:block;font-size:.68rem;color:var(--mute)}.idc-sg b{font:700 1rem Sora,sans-serif}.idc-sr{font-size:.74rem;color:var(--mute);margin-top:4px;text-align:center}
</style></head><body>
