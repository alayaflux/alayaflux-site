.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:.88rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
textarea{min-height:130px;resize:vertical}
button{background:var(--blue);color:#04101F;border:0;border-radius:10px;padding:10px 18px;font:600 .95rem Inter,sans-serif;cursor:pointer}
button.g{background:transparent;color:var(--txt);border:1px solid var(--line)}button.ok{background:var(--ok)}button.w{background:var(--warn)}button:disabled{opacity:.4;cursor:not-allowed}
button.sm{padding:6px 12px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;padding:6px 10px;background:transparent;color:var(--mute);border:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.top img{height:34px}.top small{color:var(--mute);display:block;line-height:1.2}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;max-width:900px;margin:0 auto}
.tabs button{background:var(--card);color:var(--mute);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--blue);color:#04101F}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.s-submitted{color:var(--warn)}.s-approved{color:var(--ok)}.s-feedback{color:var(--bad)}.s-draft{color:var(--mute)}
.msg{color:var(--bad);min-height:1.3em;font-size:.92rem}.mut{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sc{overflow-x:auto}.hide{display:none}
</style></head><body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG={url:'https://cvprdpamaliifrzmjzps.supabase.co',key:'sb_publishable_R2cjjbnZzzGEiJAM6w5YiQ_BMKF2Lov'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOM='@staff.alayaflux.com';
let sb,me,tab='home',editId=null;
function show(id){['vLogin','vPw','vApp'].forEach(v=>$('#'+v).classList.toggle('hide',v!==id))}
function eye(id,b){const i=$('#'+id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'}
const fmt=t=>t?new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'-';
const tm=t=>t?new Date(t).toLocaleTimeString([], {timeStyle:'short'}):'-';
const today=()=>new Date().toISOString().slice(0,10);

async function init(){
  if(CFG.url.startsWith('YOUR_')){show('vLogin');$('#lmsg').textContent='Portal is not configured yet.';return}
  sb=supabase.createClient(CFG.url,CFG.key);
  const {data}=await sb.auth.getSession(); if(data.session) await boot(); else show('vLogin');
}
async function login(e){e.preventDefault();$('#lmsg').textContent='';
  const id=$('#sid').value.trim().toLowerCase();
  const {error}=await sb.auth.signInWithPassword({email:id+DOM,password:$('#pw').value});
  if(error){$('#lmsg').textContent='Wrong Staff ID or password.';return} $('#pw').value='';await boot()}
async function logout(){await sb.auth.signOut();me=null;show('vLogin')}
async function boot(){
  const {data:{user}}=await sb.auth.getUser(); if(!user){show('vLogin');return}
  const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!data){await sb.auth.signOut();show('vLogin');$('#lmsg').textContent='Profile not found. Contact admin.';return}
  me=data; if(me.must_change_password){show('vPw');return}
  $('#who').textContent=me.name; $('#meta').textContent=me.staff_id+' | '+me.department+' | '+me.role;
  const t=[['home','Home'],['reports','Reports'],['files','My files']];
  if(me.role!=='staff')t.push(['team','Team']); if(me.role==='admin')t.push(['staff','Staff']);
  $('#tabs').innerHTML=t.map(x=>`<button data-t="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
  show('vApp'); go('home');
}
async function setPw(e){e.preventDefault();const a=$('#np').value,b=$('#np2').value,m=$('#pmsg');m.textContent='';
  if(a.length<10){m.textContent='Use at least 10 characters.';return} if(a!==b){m.textContent='Passwords do not match.';return}
  const {error}=await sb.auth.updateUser({password:a}); if(error){m.textContent=error.message;return}
  await sb.from('profiles').update({must_change_password:false}).eq('id',me.id); $('#np').value=$('#np2').value='';await boot()}
function go(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ({home,reports,files,team,staff})[t]()}

async function home(){
  const {data}=await sb.from('attendance').select('*').eq('user_id',me.id).order('date',{ascending:false}).limit(7);
  const r=(data||[]),t=r.find(x=>x.date===today());
  $('#main').innerHTML=`<div class="card"><h3>Attendance</h3><p class="mut">Today (${today()} UTC): ${t?('In '+tm(t.check_in)+' | Out '+tm(t.check_out)):'Not checked in'}</p>
  <div class="row"><button class="ok" ${t?'disabled':''} onclick="att('check_in')">Check in</button><button class="w" ${(!t||t.check_out)?'disabled':''} onclick="att('check_out')">Check out</button></div></div>
  <div class="card"><h3>Last 7 days</h3><div class="sc"><table><tr><th>Date</th><th>In</th><th>Out</th></tr>${r.map(x=>`<tr><td>${esc(x.date)}</td><td>${tm(x.check_in)}</td><td>${tm(x.check_out)}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">No records yet</td></tr>'}</table></div></div>`}
async function att(f){const {error}=await sb.rpc(f);if(error)alert(error.message);home()}

async function reports(){
  const [s,r]=await Promise.all([
    sb.from('reports').select('*').eq('sender_id',me.id).order('created_at',{ascending:false}),
    sb.from('reports').select('*').eq('receiver_staff_id',me.staff_id).neq('status','draft').order('created_at',{ascending:false})]);
  const e=(s.data||[]).find(x=>x.id===editId&&x.status==='draft')||{};
  const st=x=>`<span class="tag s-${x.status}">${x.status}</span>`;
  const fl=x=>x.file_path?` <a href="#" onclick="dl('${esc(x.file_path)}');return false">[${esc(x.file_name)}]</a>`:'';
  $('#main').innerHTML=`<div class="card"><h3>${e.id?'Edit draft':'New report'}</h3>
   <label for="rt">Send to (Staff ID)</label><input id="rt" value="${esc(e.receiver_staff_id||'')}" autocapitalize="characters" placeholder="e.g. ALF002">
   <label for="rh">Title</label><input id="rh" value="${esc(e.title||'')}">
   <label for="rb">Report</label><textarea id="rb">${esc(e.body||'')}</textarea>
   <label for="rf">Attach file (optional)</label><input id="rf" type="file">
   <p class="msg" id="rm"></p><div class="row"><button class="g" onclick="saveR('draft')">Save draft</button><button onclick="saveR('submitted')">Submit</button>${e.id?'<button class="g" onclick="editId=null;reports()">Cancel</button>':''}</div></div>
   <div class="card"><h3>Received</h3>${(r.data||[]).map(x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${esc(x.title)}</b> ${st(x)}<div class="mut">From ${esc(x.sender_staff_id)} | ${fmt(x.created_at)}</div><p style="white-space:pre-wrap">${esc(x.body)}${fl(x)}</p>${x.feedback?'<p class="mut">Feedback: '+esc(x.feedback)+'</p>':''}${x.status==='submitted'?`<div class="row"><button class="ok sm" onclick="rev(${x.id},'approved')">Approve</button><button class="w sm" onclick="rev(${x.id},'feedback')">Send feedback</button></div>`:''}</div>`).join('')||'<p class="mut">Nothing received</p>'}</div>
   <div class="card"><h3>Sent / drafts</h3>${(s.data||[]).map(x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${esc(x.title)}</b> ${st(x)}<div class="mut">To ${esc(x.receiver_staff_id)} | ${fmt(x.created_at)}</div>${fl(x)}${x.feedback?'<p class="mut">Feedback: '+esc(x.feedback)+'</p>':''}${x.status==='draft'?`<div class="row"><button class="g sm" onclick="editId=${x.id};reports()">Edit</button><button class="g sm" onclick="delR(${x.id})">Delete</button></div>`:''}</div>`).join('')||'<p class="mut">Nothing sent</p>'}</div>`}
async function saveR(status){const m=$('#rm');m.textContent='';
  const to=$('#rt').value.trim().toUpperCase(),title=$('#rh').value.trim();
  if(!to||!title){m.textContent='Staff ID and title are required.';return}
  const {data:p}=await sb.from('profiles').select('staff_id').eq('staff_id',to).maybeSingle();
  if(!p){m.textContent='No staff with that ID.';return}
  const row={receiver_staff_id:to,title,body:$('#rb').value,status};
  const f=$('#rf').files[0];
  if(f){if(f.size>10*1048576){m.textContent='File must be under 10 MB.';return}
    const path=me.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
    const u=await sb.storage.from('files').upload(path,f);if(u.error){m.textContent=u.error.message;return}
    row.file_path=path;row.file_name=f.name}
  let q;if(editId)q=sb.from('reports').update(row).eq('id',editId);else q=sb.from('reports').insert({...row,sender_id:me.id,sender_staff_id:me.staff_id});
  const {error}=await q;if(error){m.textContent=error.message;return} editId=null;reports()}
async function rev(id,status){let fb=null;if(status==='feedback'){fb=prompt('Write your feedback');if(!fb)return}
  const {error}=await sb.from('reports').update({status,feedback:fb}).eq('id',id);if(error)alert(error.message);reports()}
async function delR(id){if(confirm('Delete this draft?')){await sb.from('reports').delete().eq('id',id);reports()}}
async function dl(path){const {data,error}=await sb.storage.from('files').createSignedUrl(path,60);if(error){alert(error.message);return}window.open(data.signedUrl,'_blank')}

async function files(){
  const {data}=await sb.storage.from('files').list(me.id,{sortBy:{column:'created_at',order:'desc'}});
  $('#main').innerHTML=`<div class="card"><h3>My files</h3><p class="mut">Private to you (and admin). Max 10 MB each.</p><input id="uf" type="file"><p class="msg" id="um"></p><button onclick="upl()">Upload</button></div>
  <div class="card">${(data||[]).filter(x=>x.name!=='.emptyFolderPlaceholder').map(x=>`<div class="row sp" style="border-top:1px solid var(--line);padding:8px 0"><span>${esc(x.name.replace(/^\d+_/,''))}</span><span class="row"><button class="g sm" onclick="dl('${me.id}/${esc(x.name)}')">Download</button><button class="g sm" onclick="delF('${esc(x.name)}')">Delete</button></span></div>`).join('')||'<p class="mut">No files yet</p>'}</div>`}
async function upl(){const f=$('#uf').files[0],m=$('#um');if(!f){m.textContent='Choose a file first.';return}
  if(f.size>10*1048576){m.textContent='File must be under 10 MB.';return}
  const {error}=await sb.storage.from('files').upload(me.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_'),f);if(error){m.textContent=error.message;return}files()}
async function delF(n){if(confirm('Delete this file?')){await sb.storage.from('files').remove([me.id+'/'+n]);files()}}

async function team(){
  const d=new Date();d.setDate(d.getDate()-7);
  const {data}=await sb.from('attendance').select('*,profiles(staff_id,name,department)').gte('date',d.toISOString().slice(0,10)).order('date',{ascending:false});
  $('#main').innerHTML=`<div class="card"><h3>Team attendance (last 7 days)</h3><p class="mut">${me.role==='admin'?'All departments':'Your department'}</p><div class="sc"><table><tr><th>Date</th><th>Staff</th><th>Dept</th><th>In</th><th>Out</th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.profiles?.staff_id)} ${esc(x.profiles?.name)}</td><td>${esc(x.profiles?.department)}</td><td>${tm(x.check_in)}</td><td>${tm(x.check_out)}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">No records</td></tr>'}</table></div></div>`}

async function staff(){
  const {data}=await sb.from('profiles').select('*').order('staff_id');
  $('#main').innerHTML=`<div class="card"><h3>Staff</h3><p class="mut">New staff: create the login in Supabase (Authentication, Add user), then set name, department and role here.</p>
  ${(data||[]).map(p=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${esc(p.staff_id)}</b>
   <div class="row"><input id="n${p.id}" value="${esc(p.name)}" style="flex:2;min-width:140px"><input id="d${p.id}" value="${esc(p.department)}" style="flex:2;min-width:140px">
   <select id="r${p.id}" style="flex:1;min-width:90px">${['staff','head','admin'].map(r=>`<option ${r===p.role?'selected':''}>${r}</option>`).join('')}</select>
   <button class="sm" onclick="saveP('${p.id}')">Save</button><button class="g sm" onclick="resetPw('${esc(p.staff_id)}')">Reset password</button></div></div>`).join('')}</div>`}
async function saveP(id){const {error}=await sb.from('profiles').update({name:$('#n'+id).value.trim(),department:$('#d'+id).value.trim(),role:$('#r'+id).value}).eq('id',id);
  alert(error?error.message:'Saved')}
async function resetPw(id){if(!confirm('Reset password for '+id+'? Their old password will stop working.'))return;
  const {data,error}=await sb.functions.invoke('hyper-responder',{body:{staff_id:id}});
  if(error||!data||data.error){alert('Reset failed: '+((data&&data.error)||(error&&error.message)||'unknown'));return}
  prompt('New temporary password for '+data.staff_id+' (copy it, share privately):',data.password)}
init();
</script></body></html>
