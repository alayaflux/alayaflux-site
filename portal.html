.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:.88rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
textarea{min-height:130px;resize:vertical}
button{background:var(--blue);color:#04101F;border:0;border-radius:10px;padding:10px 18px;font:600 .95rem Inter,sans-serif;cursor:pointer}
button.g{background:transparent;color:var(--txt);border:1px solid var(--line)}button.ok{background:var(--ok)}button.w{background:var(--warn)}button:disabled{opacity:.4;cursor:not-allowed}
button.sm{padding:6px 12px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;padding:6px 10px;background:transparent;color:var(--mute);border:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.top img{height:34px}.top small{color:var(--mute);display:block;line-height:1.2}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;max-width:900px;margin:0 auto}
.tabs button{background:var(--card);color:var(--mute);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--blue);color:#04101F}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.s-submitted{color:var(--warn)}.s-approved{color:var(--ok)}.s-feedback{color:var(--bad)}.s-draft{color:var(--mute)}
.msg{color:var(--bad);min-height:1.3em;font-size:.92rem}.mut{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sc{overflow-x:auto}.hide{display:none}

.sl-hero{text-align:center;padding:4px 0}.sl-eye{font-size:.76rem;letter-spacing:.22em;color:#F2C45A;font-weight:600}
.sl-hero h2{font-size:1.7rem;margin:4px 0 2px}.sl-stage{perspective:1100px;height:270px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;cursor:grab}
.sl-coin{position:relative;width:220px;height:220px;transform-style:preserve-3d}
.sl-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.sl-face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.sl-face i{position:absolute;inset:0;border-radius:50%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);background-size:260% 100%;mix-blend-mode:soft-light;pointer-events:none}
.sl-edge{position:absolute}.sl-shadow{width:160px;height:20px;margin:-10px auto 4px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(3px)}
.sl-val{font:700 1.9rem Sora,sans-serif;letter-spacing:-.02em;line-height:1.1}.sl-up{color:var(--ok)}.sl-down{color:var(--bad)}
.sl-rng{display:flex;gap:6px}.sl-rng button{background:transparent;border:1px solid var(--line);color:var(--mute);padding:5px 11px;font-size:.8rem}.sl-rng button.on{background:#F2C45A;color:#1a1204;border-color:#F2C45A}
.sl-svg{width:100%;display:block;margin-top:10px;touch-action:none}
.sl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sl-st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.sl-st b{display:block;font:700 1.1rem Sora,sans-serif;margin-top:2px}
.sl-mem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.sl-mem:first-of-type{border-top:0}
.sl-bar{height:6px;border-radius:6px;background:var(--bg2);margin-top:6px;overflow:hidden}.sl-bar i{display:block;height:100%;background:linear-gradient(90deg,#B8862B,#F2C45A)}
.sl-inp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
@media(min-width:620px){.sl-grid{grid-template-columns:repeat(3,1fr)}.sl-coin{width:250px;height:250px}.sl-stage{height:310px}}

.idc{max-width:420px;margin:0 auto;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#10294a,#070e1a 70%);border:1px solid #B8862B;box-shadow:0 10px 30px rgba(0,0,0,.45);position:relative}
.idc>*{position:relative}.idc>.idc-wm{position:absolute;left:50%;top:44%;width:62%;transform:translate(-50%,-50%);opacity:.06;pointer-events:none}
.idc-top{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(90deg,#B8862B,#F2C45A);color:#1a1204}.idc-top img{height:38px;width:auto}
.idc-h{font:700 1.05rem Sora,sans-serif;letter-spacing:.06em;line-height:1.1}.idc-sub{font-size:.76rem}
.idc-body{display:flex;gap:14px;padding:16px}
.idc-ph{width:104px;height:132px;border-radius:10px;border:2px solid #F2C45A;background:var(--bg2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--mute);font-size:.7rem;text-align:center}.idc-ph img{width:100%;height:100%;object-fit:cover}
.idc-n{font:700 1.2rem Sora,sans-serif;line-height:1.15}.idc-f{font-size:.82rem;color:var(--mute);margin-top:6px;line-height:1.65}.idc-f b{color:var(--txt);font-weight:600}
.idc-sig{padding:0 16px 10px;display:flex;align-items:flex-end;gap:10px;font-size:.72rem;color:var(--mute)}.idc-sig img{height:44px;max-width:160px;background:#fff;border-radius:4px;padding:2px;object-fit:contain}
.idc-coins{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 10px 8px;border-top:1px solid #1E3350;background:rgba(0,0,0,.25)}
.idc-c{text-align:center;font-size:.7rem;color:var(--mute)}.idc-c img{width:56px;height:56px}.idc-c b{display:block;font-size:1rem;color:var(--txt)}
.idc-tot{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:linear-gradient(90deg,rgba(184,134,43,.15),rgba(242,196,90,.25))}.idc-tot b{font:700 1.6rem Sora,sans-serif;color:#F2C45A}
.idc-ft{text-align:center;font-size:.7rem;color:var(--mute);padding:8px 8px 12px}
@media print{body *{visibility:hidden}#idc,#idc *{visibility:visible}#idc{position:absolute;left:0;top:0}}
.idc-seal{margin:0 12px 10px;padding:8px 10px;border:1px solid #B8862B;border-radius:10px;background:rgba(184,134,43,.1)}.idc-sh{font:700 .72rem Sora,sans-serif;letter-spacing:.12em;color:#F2C45A;margin-bottom:4px}.idc-sg{display:flex;gap:6px}.idc-sg div{flex:1;text-align:center}.idc-sg span{display:block;font-size:.68rem;color:var(--mute)}.idc-sg b{font:700 1rem Sora,sans-serif}.idc-sr{font-size:.74rem;color:var(--mute);margin-top:4px;text-align:center}
</style></head><body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="portal-images.js"></script>
<script>
const CFG={url:'https://cvprdpamaliifrzmjzps.supabase.co',key:'sb_publishable_R2cjjbnZzzGEiJAM6w5YiQ_BMKF2Lov'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOM='@staff.alayaflux.com';
let sb,me,tab='home',editId=null;
function show(id){['vLogin','vPw','vApp'].forEach(v=>$('#'+v).classList.toggle('hide',v!==id))}
function eye(id,b){const i=$('#'+id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'}
const fmt=t=>t?new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'-';
const tm=t=>t?new Date(t).toLocaleTimeString([], {timeStyle:'short'}):'-';
const today=()=>new Date().toISOString().slice(0,10);

async function init(){
  if(CFG.url.startsWith('YOUR_')){show('vLogin');$('#lmsg').textContent='Portal is not configured yet.';return}
  sb=supabase.createClient(CFG.url,CFG.key);
  const {data}=await sb.auth.getSession(); if(data.session) await boot(); else show('vLogin');
}
async function login(e){e.preventDefault();$('#lmsg').textContent='';
  const id=$('#sid').value.trim().toLowerCase();
  const {error}=await sb.auth.signInWithPassword({email:id+DOM,password:$('#pw').value});
  if(error){$('#lmsg').textContent='Wrong Staff ID or password.';return} $('#pw').value='';await boot()}
async function logout(){await sb.auth.signOut();me=null;show('vLogin')}
async function boot(){
  const {data:{user}}=await sb.auth.getUser(); if(!user){show('vLogin');return}
  const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!data){await sb.auth.signOut();show('vLogin');$('#lmsg').textContent='Profile not found. Contact admin.';return}
  me=data; if(me.must_change_password){show('vPw');return}
  $('#who').textContent=me.name; $('#meta').textContent=me.staff_id+' | '+me.department+' | '+me.role;
  const t=[['home','Home'],['reports','Reports'],['files','My files'],['seal','Seal'],['workplace','Workplace']];
  t.push(['idcard','ID Card']); if(me.role!=='staff')t.push(['team','Team']); if(me.role==='admin'){t.push(['idadmin','ID Admin']);t.push(['staff','Staff'])}
  $('#tabs').innerHTML=t.map(x=>`<button data-t="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
  show('vApp'); go('home'); loadLinks();
}
async function setPw(e){e.preventDefault();const a=$('#np').value,b=$('#np2').value,m=$('#pmsg');m.textContent='';
  if(a.length<10){m.textContent='Use at least 10 characters.';return} if(a!==b){m.textContent='Passwords do not match.';return}
  const {error}=await sb.auth.updateUser({password:a}); if(error){m.textContent=error.message;return}
  await sb.from('profiles').update({must_change_password:false}).eq('id',me.id); $('#np').value=$('#np2').value='';await boot()}
function go(t){if(t==='workplace'){openWork();return}tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ({home,reports,files,seal,idcard,idadmin,team,staff})[t]()}

async function home(){
  const {data}=await sb.from('attendance').select('*').eq('user_id',me.id).order('date',{ascending:false}).limit(7);
  const r=(data||[]),t=r.find(x=>x.date===today());
  $('#main').innerHTML=`<div class="card"><h3>Attendance</h3><p class="mut">Today (${today()} UTC): ${t?('In '+tm(t.check_in)+' | Out '+tm(t.check_out)):'Not checked in'}</p>
  <div class="row"><button class="ok" ${t?'disabled':''} onclick="att('check_in')">Check in</button><button class="w" ${(!t||t.check_out)?'disabled':''} onclick="att('check_out')">Check out</button></div></div>
  <div class="card"><h3>Last 7 days</h3><div class="sc"><table><tr><th>Date</th><th>In</th><th>Out</th></tr>${r.map(x=>`<tr><td>${esc(x.date)}</td><td>${tm(x.check_in)}</td><td>${tm(x.check_out)}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">No records yet</td></tr>'}</table></div></div>`}
async function att(f){const {error}=await sb.rpc(f);if(error)alert(error.message);home()}

async function reports(){
  const [s,r]=await Promise.all([
    sb.from('reports').select('*').eq('sender_id',me.id).order('created_at',{ascending:false}),
    sb.from('reports').select('*').eq('receiver_staff_id',me.staff_id).neq('status','draft').order('created_at',{ascending:false})]);
  const e=(s.data||[]).find(x=>x.id===editId&&x.status==='draft')||{};
  const st=x=>`<span class="tag s-${x.status}">${x.status}</span>`;
  const fl=x=>x.file_path?` <a href="#" onclick="dl('${esc(x.file_path)}');return false">[${esc(x.file_name)}]</a>`:'';
  $('#main').innerHTML=`<div class="card"><h3>${e.id?'Edit draft':'New report'}</h3>
   <label for="rt">Send to (Staff ID)</label><input id="rt" value="${esc(e.receiver_staff_id||'')}" autocapitalize="characters" placeholder="e.g. ALF002">
   <label for="rh">Title</label><input id="rh" value="${esc(e.title||'')}">
   <label for="rb">Report</label><textarea id="rb">${esc(e.body||'')}</textarea>
   <label for="rf">Attach file (optional)</label><input id="rf" type="file">
   <p class="msg" id="rm"></p><div class="row"><button class="g" onclick="saveR('draft')">Save draft</button><button onclick="saveR('submitted')">Submit</button>${e.id?'<button class="g" onclick="editId=null;reports()">Cancel</button>':''}</div></div>
   <div class="card"><h3>Received</h3>${(r.data||[]).map(x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${esc(x.title)}</b> ${st(x)}<div class="mut">From ${esc(x.sender_staff_id)} | ${fmt(x.created_at)}</div><p style="white-space:pre-wrap">${esc(x.body)}${fl(x)}</p>${x.feedback?'<p class="mut">Feedback: '+esc(x.feedback)+'</p>':''}${x.status==='submitted'?`<div class="row"><button class="ok sm" onclick="rev(${x.id},'approved')">Approve</button><button class="w sm" onclick="rev(${x.id},'feedback')">Send feedback</button></div>`:''}</div>`).join('')||'<p class="mut">Nothing received</p>'}</div>

async function slSaveM(id){const n=$('#smn'+id).value.trim(),c=parseFloat($('#smc'+id).value);if(!n||!(c>=0)){slErr('Enter a name and the number of coins.');return}
  const pct=v=>{const t=String(v).trim();if(t==='')return null;const x=parseFloat(t);return(x>=0&&x<=100)?x:NaN};
  const eq=pct($('#sme'+id).value),gv=pct($('#smg'+id).value);if(Number.isNaN(eq)||Number.isNaN(gv)){slErr('Equity and power must be between 0 and 100.');return}
  const e1=await sb.from('seal_members').update({name:n,coins:c,user_id:$('#smu'+id).value||null}).eq('id',id);if(e1.error){slErr(e1.error.message);return}
  const row={equity_pct:eq,governance_pct:gv,rights:$('#smr'+id).value.trim()||null,show_on_id:$('#smi'+id).checked,updated_at:new Date().toISOString()};
  const e2=sl.r[id]?await sb.from('seal_rights').update(row).eq('member_id',id):await sb.from('seal_rights').insert({...row,member_id:id});
  if(e2.error){slErr(e2.error.message);return}alert('Saved');seal()}
async function slDelM(id){if(!confirm('Remove this member from the Seal?'))return;const {error}=await sb.from('seal_members').delete().eq('id',id);if(error){alert(error.message);return}seal()}

/* ===== ID CARD + COINS ===== */
const IDC={silver:PI.silver||"",gold:PI.gold||"",diamond:PI.diamond||"",platinum:PI.platinum||""};

const IDT=['Passport','National ID','Aadhaar','Driving Licence','Voter ID','Other'];
let idS={pid:null},idA={uid:null,pid:null};
const idDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'-';
async function idImg(el,path){if(!el||!path)return;const {data}=await sb.storage.from('idcards').createSignedUrl(path,3600);if(data&&data.signedUrl)el.src=data.signedUrl}
async function idcard(){
  $('#main').innerHTML='<div class="card"><p class="mut">Loading...</p></div>';
  const [c,p]=await Promise.all([sb.from('id_cards').select('*').eq('user_id',me.id).order('id'),sb.from('programmes').select('*').order('id')]);
  if(c.error||p.error){$('#main').innerHTML='<div class="card"><p class="msg">ID Card is not set up yet. Run the ID Card SQL in Supabase first.</p></div>';return}
  const progs=(p.data||[]).filter(x=>!x.hidden),cards=(c.data||[]).filter(x=>progs.find(y=>y.id==x.programme_id));
  if(!cards.length){$('#main').innerHTML='<div class="card"><h3>ID Card</h3><p class="mut">Your ID card has not been issued yet. The admin will create it.</p></div>';return}
  if(!cards.find(x=>x.programme_id==idS.pid))idS.pid=cards[cards.length-1].programme_id;
  const card=cards.find(x=>x.programme_id==idS.pid),prog=progs.find(x=>x.id==idS.pid)||{};
  const a=await sb.from('coin_awards').select('*').eq('user_id',me.id).eq('programme_id',idS.pid);
  const aw=a.data||[];let counts={silver:0,gold:0,diamond:0,platinum:0},total=0;aw.forEach(x=>{counts[x.coin]++;total+=x.points});

  if(prog.status==='closed'){const r=await sb.from('programme_results').select('*').eq('programme_id',idS.pid).eq('user_id',me.id).maybeSingle();if(r.data){IDN.forEach(k=>counts[k]=r.data[k]);total=r.data.total_points;final=true}}
  let sealHtml='';
  try{const sm=await sb.from('seal_members').select('*').eq('user_id',me.id);const mem=(sm.data||[])[0];
    if(mem){const sr=await sb.from('seal_rights').select('*').eq('member_id',mem.id).maybeSingle();const r=sr.data;
      if(r&&r.show_on_id){sealHtml=`<div class="idc-seal"><div class="idc-sh">FOUNDERS' SEAL</div><div class="idc-sg"><div><span>Equity</span><b>${r.equity_pct==null?'-':slNum(r.equity_pct)+'%'}</b></div><div><span>Power</span><b>${r.governance_pct==null?'-':slNum(r.governance_pct)+'%'}</b></div><div><span>Seal coins</span><b>${slNum(mem.coins)}</b></div></div>${r.rights?`<div class="idc-sr">${esc(r.rights)}</div>`:''}</div>`}}}catch(e){}
  const logo=(document.querySelector('.top img')||{}).src||'';
  const sel=cards.length>1?`<select id="idsel" onchange="idS.pid=+this.value;idcard()" style="margin-bottom:12px">${cards.map(x=>`<option value="${x.programme_id}" ${x.programme_id==idS.pid?'selected':''}>${esc((progs.find(p=>p.id==x.programme_id)||{}).name||'Programme')}</option>`).join('')}</select>`:'';
  $('#main').innerHTML=`${sel}<div class="idc" id="idc"><img class="idc-wm" src="${logo}" alt="">
   <div class="idc-top"><img src="${logo}" alt=""><div><div class="idc-h">INTERNSHIP PROGRAM</div><div class="idc-sub">ALAYAflux | ${esc(prog.name||'')}</div></div></div>
   <div class="idc-body"><div class="idc-ph"><span>No photo</span><img id="idph" alt="Photo" style="display:none" onload="this.style.display='block';this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"></div>
    <div><div class="idc-n">${esc(card.full_name)}</div><div class="idc-f"><b>Staff ID:</b> ${esc(me.staff_id)}<br><b>Date of birth:</b> ${idDate(card.dob)}<br><b>Country:</b> ${esc(card.country||'-')}<br><b>Govt ID:</b> ${esc(card.govt_id_type||'-')}${card.govt_id_last4?' XXXX-'+esc(card.govt_id_last4):''}<br><b>Programme:</b> ${idDate(prog.start_date)} to ${idDate(prog.end_date)}</div></div></div>
   <div class="idc-sig"><img id="idsg" alt="Signature" style="display:none" onload="this.style.display='block'" onerror="this.style.display='none'"><span>Signature</span></div>
   ${sealHtml}<div class="idc-coins">${IDN.map(k=>`<div class="idc-c"><img src="${IDC[k]}" alt="${k}"><b>x ${counts[k]}</b>${k[0].toUpperCase()+k.slice(1)}<br>${IDV[k]} pts</div>`).join('')}</div>
   <div class="idc-tot"><span>${final?'FINAL POINTS':'TOTAL POINTS'}</span><b>${total}</b></div>
   <div class="idc-ft">${prog.status==='closed'?'PROGRAMME COMPLETED'+(prog.closed_at?' | '+idDate(prog.closed_at.slice(0,10)):''):'PROGRAMME IN PROGRESS'} | From Thought to Reality</div></div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="g sm" onclick="window.print()">Print / Save as PDF</button></div>
  <div class="card" style="margin-top:14px"><h3>My coins</h3>${aw.length?aw.slice().reverse().map(x=>`<div class="row sp" style="border-top:1px solid var(--line);padding:8px 0"><span><b>${x.coin[0].toUpperCase()+x.coin.slice(1)}</b> <span class="mut">${esc(x.reason)}</span></span><span>+${x.points}</span></div>`).join(''):'<p class="mut">No coins yet.</p>'}</div>`;
  idImg($('#idph'),card.photo_path);idImg($('#idsg'),card.signature_path);
}
function idResize(file,maxW,type){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);const g=c.getContext('2d');
    if(type==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)}g.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('Image error'))},type,.88)};
  img.onerror=()=>rej(new Error('Could not read the image'));img.src=u})}
async function idadmin(){
  $('#main').innerHTML='<div class="card"><p class="mut">Loading...</p></div>';
  const [pr,pg,ic,ca,rs]=await Promise.all([sb.from('profiles').select('*').order('staff_id'),sb.from('programmes').select('*').order('id'),sb.from('id_cards').select('*').order('id'),sb.from('coin_awards').select('*').order('id'),sb.from('programme_results').select('*').order('total_points')]);
  if(pg.error||ic.error){$('#main').innerHTML='<div class="card"><p class="msg">ID Card is not set up yet. Run the ID Card SQL in Supabase first.</p></div>';return}
  idA.profiles=pr.data||[];idA.all=pg.data||[];idA.progs=idA.all.filter(p=>!p.hidden);idA.hid=idA.all.filter(p=>p.hidden);idA.cards=ic.data||[];idA.awards=ca.data||[];idA.results=rs.data||[];
  const open=idA.progs.filter(p=>p.status==='open'),sid=u=>((idA.profiles.find(p=>p.id==u)||{}).staff_id||'?');
  if(!idA.uid&&idA.profiles.length)idA.uid=idA.profiles[0].id; if(!idA.progs.find(p=>p.id==idA.pid))idA.pid=(open[0]||idA.progs[idA.progs.length-1]||{}).id||null;
  const staffOpt=idA.profiles.map(p=>`<option value="${p.id}" ${p.id==idA.uid?'selected':''}>${esc(p.staff_id)} ${esc(p.name)}</option>`).join('');
  const progOpt=idA.progs.map(p=>`<option value="${p.id}" ${p.id==idA.pid?'selected':''}>${esc(p.name)} (${p.status})</option>`).join('');
  const ex=idA.cards.find(c=>c.user_id==idA.uid&&c.programme_id==idA.pid)||{};
  const prof=idA.profiles.find(p=>p.id==idA.uid)||{};
  const awardStaff=idA.cards.filter(c=>c.programme_id==(open[0]||{}).id);
  $('#main').innerHTML=`<div class="card"><h3>1. Programme</h3>
   ${idA.progs.map(p=>idProgRow(p,false)).join('')||'<p class="mut">No programme yet. Create one below.</p>'}
   ${idA.hid.length?`<p class="mut" style="margin:12px 0 0">Hidden programmes (not shown on ID cards)</p>${idA.hid.map(p=>idProgRow(p,true)).join('')}`:''}
   <label>New programme name</label><input id="ipn" placeholder="e.g. Internship Program 2026-27"><div class="sl-inp"><input id="ips" type="date" style="flex:1"><input id="ipe" type="date" style="flex:1"><button class="sm" onclick="idNewProg()">Create</button></div><p class="msg" id="idm0"></p></div>
  <div class="card"><h3>2. Issue / edit ID card</h3>
   <label>Staff</label><select id="idu" onchange="idA.uid=this.value;idadmin()">${staffOpt}</select>
   <label>Programme</label><select id="idp" onchange="idA.pid=+this.value;idadmin()">${progOpt}</select>
   <label>Full name</label><input id="idn" value="${esc(ex.full_name||prof.name||'')}">
   <label>Date of birth</label><input id="idb" type="date" value="${esc(ex.dob||'')}">
   <label>Country</label><input id="idy" value="${esc(ex.country||'')}">
   <label>Govt ID type</label><select id="idt">${IDT.map(t=>`<option ${t===ex.govt_id_type?'selected':''}>${t}</option>`).join('')}</select>
   <label>Govt ID: last 4 characters only</label><input id="idl" maxlength="4" value="${esc(ex.govt_id_last4||'')}" placeholder="1234"><p class="mut" style="margin:4px 0 0;font-size:.82rem">Do not enter the full ID number.</p>
   <label>Photo ${ex.photo_path?'(uploaded, choose to replace)':''}</label><input id="idphf" type="file" accept="image/*">
   <label>Signature image ${ex.signature_path?'(uploaded, choose to replace)':''}</label><input id="idsgf" type="file" accept="image/*">
   <p class="msg" id="idm1"></p><button onclick="idSaveCard()">Save ID card</button></div>
  <div class="card"><h3>3. Award a coin</h3><p class="mut" style="margin:0 0 6px">Points are added automatically. Silver 100, Gold 200, Diamond 300, Platinum 500.</p>
   ${open[0]?`<label>Staff (has a card in ${esc(open[0].name)})</label><select id="iau">${awardStaff.map(c=>`<option value="${c.user_id}">${esc(sid(c.user_id))} ${esc(c.full_name)}</option>`).join('')}</select>
   <label>Coin</label><select id="iac">${IDN.map(k=>`<option value="${k}">${k[0].toUpperCase()+k.slice(1)} (${IDV[k]} pts)</option>`).join('')}</select>
   <label>Reason</label><input id="iar" placeholder="e.g. Completed Week 4 project on time"><p class="msg" id="idm2"></p><button onclick="idAward(${open[0].id})">Award coin</button>`:'<p class="mut">No open programme.</p>'}
   <h3 style="margin-top:16px">Recent awards</h3>${idA.awards.slice(-8).reverse().map(x=>{const pr2=idA.progs.find(p=>p.id==x.programme_id)||{};return `<div class="row sp" style="border-top:1px solid var(--line);padding:6px 0"><span><b>${esc(sid(x.user_id))}</b> ${x.coin} <span class="mut">${esc(x.reason)}</span></span>${pr2.status==='open'?`<button class="g sm" onclick="idDelAward(${x.id})">Delete</button>`:''}</div>`}).join('')||'<p class="mut">No awards yet.</p>'}</div>
  <div class="card"><h3>4. Final results (closed programmes)</h3>${idA.progs.filter(p=>p.status==='closed').map(p=>`<p><b>${esc(p.name)}</b></p><div class="sc"><table><tr><th>Staff</th><th>Name</th><th>S</th><th>G</th><th>D</th><th>P</th><th>Total</th></tr>${idA.results.filter(r=>r.programme_id==p.id).sort((a,b)=>b.total_points-a.total_points).map(r=>`<tr><td>${esc(r.staff_id)}</td><td>${esc(r.full_name)}</td><td>${r.silver}</td><td>${r.gold}</td><td>${r.diamond}</td><td>${r.platinum}</td><td><b>${r.total_points}</b></td></tr>`).join('')}</table></div>`).join('')||'<p class="mut">No programme closed yet.</p>'}</div>`;
}
const idMsg=(id,t)=>{const e=$('#'+id);if(e)e.textContent=t;else alert(t)};
function idProgRow(p,hid){
  const used=(idA.cards||[]).some(c=>c.programme_id==p.id)||(idA.awards||[]).some(x=>x.programme_id==p.id)||(idA.results||[]).some(r=>r.programme_id==p.id);
  const st=hid?'':(p.status==='open'?`<button class="w sm" onclick="idClose(${p.id})">Close programme</button>`:`<button class="g sm" onclick="idReopen(${p.id})">Reopen programme</button>`);
  const hb=hid?`<button class="g sm" onclick="idHide(${p.id},false)">Show again</button>`:`<button class="g sm" onclick="idHide(${p.id},true)">Hide</button>`;
  const del=used?'':`<button class="g sm" onclick="idDelProg(${p.id})">Delete</button>`;
  return `<div style="border-top:1px solid var(--line);padding:10px 0"><div><b>${esc(p.name)}</b> <span class="tag s-${p.status==='open'?'submitted':'approved'}">${p.status}</span>${used?'':' <span class="mut" style="font-size:.8rem">(empty)</span>'}</div><div class="row" style="margin-top:6px">${st}${hb}${del}</div></div>`}
async function idNewProg(){if(idNewProg.busy)return;const n=$('#ipn').value.trim();if(!n){idMsg('idm0','Enter a programme name.');return}
  if((idA.all||[]).some(p=>!p.hidden&&p.name.trim().toLowerCase()===n.toLowerCase())){idMsg('idm0','A programme with this name already exists.');return}
  idNewProg.busy=true;
  const {error}=await sb.from('programmes').insert({name:n,start_date:$('#ips').value||null,end_date:$('#ipe').value||null});idNewProg.busy=false;if(error){idMsg('idm0',error.message);return}idadmin()}
async function idHide(pid,flag){const p=(idA.all||[]).find(x=>x.id==pid)||{};
  if(flag&&!confirm('Hide "'+(p.name||'this programme')+'"? It will not show on ID cards or in the coin form. Nothing is deleted and you can show it again.'))return;
  const {error}=await sb.from('programmes').update({hidden:flag}).eq('id',pid);if(error){alert(error.message);return}idadmin()}
async function idDelProg(pid){const p=(idA.all||[]).find(x=>x.id==pid)||{};
  if(!confirm('Delete the empty programme "'+(p.name||'')+'" for good?'))return;
  const {error}=await sb.rpc('delete_programme',{pid});if(error){alert(error.message);return}idadmin()}
async function idClose(pid){const p=(idA.progs||[]).find(x=>x.id==pid)||{};
  const t=prompt('Close "'+(p.name||'this programme')+'"?\nFinal points of every staff with an ID card will be saved and no more coins can be awarded.\n\nType CLOSE to confirm:');
  if(t===null)return;if(t.trim().toUpperCase()!=='CLOSE'){alert('Not closed. You must type CLOSE.');return}
  const {error}=await sb.rpc('close_programme',{pid});if(error){alert(error.message);return}idadmin()}
async function idReopen(pid){const p=(idA.progs||[]).find(x=>x.id==pid)||{};
  if(!confirm('Reopen "'+(p.name||'this programme')+'"? The saved final results will be removed and recalculated the next time you close it. Coins already awarded stay.'))return;
  const {error}=await sb.rpc('reopen_programme',{pid});if(error){alert(error.message);return}idadmin()}
async function idSaveCard(){
  const uid=idA.uid,pid=+idA.pid,m='idm1';if(!pid){idMsg(m,'Create a programme first.');return}
  const pg=idA.progs.find(p=>p.id==pid);if(pg&&pg.status==='closed'){idMsg(m,'This programme is closed.');return}
  const name=$('#idn').value.trim(),l4=$('#idl').value.trim();
  if(!name){idMsg(m,'Full name is required.');return}if(l4&&!/^[A-Za-z0-9]{1,4}$/.test(l4)){idMsg(m,'Govt ID: enter only the last 4 letters/digits.');return}
  const row={full_name:name,dob:$('#idb').value||null,country:$('#idy').value.trim()||null,govt_id_type:$('#idt').value,govt_id_last4:l4||null};
  try{
    const ph=$('#idphf').files[0],sg=$('#idsgf').files[0];
    if(ph){const p=`${uid}/${pid}-photo.jpg`,b=await idResize(ph,480,'image/jpeg'),r=await sb.storage.from('idcards').upload(p,b,{upsert:true,contentType:'image/jpeg'});if(r.error)throw r.error;row.photo_path=p}
    if(sg){const p=`${uid}/${pid}-sign.png`,b=await idResize(sg,600,'image/png'),r=await sb.storage.from('idcards').upload(p,b,{upsert:true,contentType:'image/png'});if(r.error)throw r.error;row.signature_path=p}
  }catch(e){idMsg(m,'Upload failed: '+(e.message||e));return}
  const ex=idA.cards.find(c=>c.user_id==uid&&c.programme_id==pid);
  const {error}=ex?await sb.from('id_cards').update(row).eq('id',ex.id):await sb.from('id_cards').insert({...row,user_id:uid,programme_id:pid});
  if(error){idMsg(m,error.message);return}alert('ID card saved');idadmin()}
async function idAward(pid){const u=$('#iau').value,c=$('#iac').value,r=$('#iar').value.trim();
  if(!u){idMsg('idm2','Choose a staff member (issue an ID card first).');return}if(!r){idMsg('idm2','Write the reason for this coin.');return}
  const {error}=await sb.from('coin_awards').insert({user_id:u,programme_id:pid,coin:c,reason:r});if(error){idMsg('idm2',error.message);return}idadmin()}
async function idDelAward(id){if(!confirm('Delete this coin award?'))return;const {error}=await sb.from('coin_awards').delete().eq('id',id);if(error){alert(error.message);return}idadmin()}
init();
